<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>网页抽卡工具 - Supabase 联网多端版</title>
    <!-- 引入 Supabase 客户端 SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #121214;
            color: #fff;
            min-height: 100vh;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 顶部导航栏 & 资产栏 */
        .navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #1a1a22;
            padding: 12px 30px;
            border-bottom: 1px solid #2f2f3d;
            width: 100%;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-links {
            display: flex;
            gap: 15px;
        }

        .nav-btn {
            background: #2b2b36;
            color: #a0a0ab;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }

        .nav-btn.active {
            background: linear-gradient(135deg, #ffd700, #ff9900);
            color: #121214;
            box-shadow: 0 4px 15px rgba(255, 215, 0, 0.3);
        }

        .user-assets {
            display: flex;
            align-items: center;
            gap: 12px;
            background: #252530;
            padding: 6px 16px;
            border-radius: 20px;
            border: 1px solid #3a3a4c;
        }

        .coin-display {
            color: #ffd700;
            font-weight: bold;
            font-size: 16px;
        }

        .claim-btn {
            background: #4cd137;
            color: #121214;
            border: none;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
        }

        /* 页面主体容器 */
        .container {
            max-width: 1100px;
            width: 100%;
            padding: 30px 20px;
            display: flex;
            justify-content: center;
        }

        .tab-pane {
            display: none;
            width: 100%;
        }

        .tab-pane.active {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        /* 公共卡片样式 */
        .card-container {
            perspective: 1000px;
        }

        .card {
            width: 220px;
            height: 320px;
            background: #1e1e24;
            border-radius: 16px;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.1s ease-out, box-shadow 0.3s ease;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 2px solid rgba(255, 215, 0, 0.4);
        }

        .card.n { border-color: rgba(160, 160, 171, 0.6); }
        .card.sr { border-color: rgba(64, 156, 255, 0.8); }
        .card.ssr { border-color: rgba(255, 215, 0, 1); box-shadow: 0 0 20px rgba(255, 215, 0, 0.4); }

        .card-content {
            position: absolute;
            inset: 0;
            padding: 12px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            background: linear-gradient(135deg, #2b2b36 0%, #15151a 100%);
            border-radius: 14px;
            z-index: 1;
            pointer-events: none;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            font-size: 13px;
        }
        .card.n .card-header { color: #a0a0ab; }
        .card.sr .card-header { color: #409cff; }
        .card.ssr .card-header { color: #ffd700; }

        .card-image-box {
            width: 100%;
            height: 150px;
            border-radius: 8px;
            overflow: hidden;
            background: #000;
        }

        .card-image-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card-footer h3 {
            font-size: 14px;
            margin-bottom: 2px;
            color: #fff;
        }

        .card-footer p {
            font-size: 10px;
            color: #a0a0ab;
            line-height: 1.2;
            height: 24px;
            overflow: hidden;
        }

        .card-shine {
            position: absolute;
            inset: 0;
            border-radius: 14px;
            z-index: 2;
            pointer-events: none;
            mix-blend-mode: color-dodge;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        /* 1. 套组工坊样式 */
        .workshop-panel {
            background: #1a1a22;
            padding: 30px;
            border-radius: 20px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .template-selector {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .template-card {
            background: #2b2b36;
            border: 2px solid #3f3f4e;
            padding: 12px 20px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .template-card.selected {
            border-color: #ffd700;
            background: #353545;
        }

        .slots-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .slot-card-box {
            background: #252530;
            border: 1px solid #3a3a4c;
            padding: 15px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .slot-header {
            font-size: 13px;
            color: #ffd700;
            font-weight: bold;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .input-group label { font-size: 11px; color: #a0a0ab; }
        .input-group input, .input-group textarea {
            background: #1e1e24; border: 1px solid #3f3f4e; padding: 6px 10px; border-radius: 6px; color: #fff; font-size: 12px;
        }
        .input-group textarea { resize: none; height: 45px; }

        .action-btn {
            background: linear-gradient(135deg, #ffd700, #ff9900);
            color: #121214; border: none; padding: 12px 24px; border-radius: 8px;
            font-weight: bold; font-size: 15px; cursor: pointer; align-self: center;
        }
        .action-btn:hover { opacity: 0.9; }

        /* 2. 抽卡中心样式 */
        .gacha-layout {
            display: flex;
            gap: 30px;
            width: 100%;
        }

        .pack-list-panel {
            width: 280px;
            background: #1a1a22;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 500px;
            overflow-y: auto;
        }

        .pack-item {
            background: #252530;
            border: 1px solid #3a3a4c;
            padding: 12px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .pack-item.selected {
            border-color: #ffd700;
            background: #353545;
        }

        .gacha-box {
            flex: 1;
            text-align: center;
            background: #1a1a22;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .gacha-result {
            display: flex;
            justify-content: center;
            gap: 15px;
            min-height: 320px;
            align-items: center;
            margin: 15px 0;
            flex-wrap: wrap;
        }

        #gachaOverlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(10, 10, 12, 0.92);
            z-index: 1000;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .summon-orb {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            background: radial-gradient(circle, #fff 0%, #ffd700 40%, #ff4500 80%, #111 100%);
            box-shadow: 0 0 60px #ffd700, 0 0 120px #ff4500;
            animation: orbPulse 1.2s infinite alternate ease-in-out;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 16px;
            color: #1a1a22;
        }

        @keyframes orbPulse {
            0% { transform: scale(1); box-shadow: 0 0 40px #ffd700, 0 0 80px #ff4500; }
            100% { transform: scale(1.12); box-shadow: 0 0 80px #ffea79, 0 0 150px #ff2e00; }
        }

        .card-container.reveal-anim {
            animation: cardPopIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            opacity: 0;
            transform: scale(0.3) translateY(100px);
        }

        @keyframes cardPopIn {
            0% { opacity: 0; transform: scale(0.3) translateY(100px) rotateX(20deg); }
            100% { opacity: 1; transform: scale(0.85) translateY(0) rotateX(0deg); }
        }

        /* 3. 集卡册样式 */
        .collection-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
            width: 100%;
        }
        .collection-card-wrapper {
            background: #1a1a22;
            padding: 15px;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.4);
        }
        .card-meta {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 5px;
        }
        .card-count { font-size: 13px; color: #ffd700; font-weight: bold; }
        .recycle-btn {
            background: #e74c3c; color: #fff; border: none; padding: 4px 10px; border-radius: 6px; font-size: 11px; cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- 抽卡演出遮罩 -->
    <div id="gachaOverlay">
        <div class="summon-orb" onclick="finishSummonAnimation()">✨ 点击开启</div>
        <p style="color: #a0a0ab; margin-top: 25px; font-size: 15px;" id="summonTip">命运之轮正在转动...</p>
    </div>

    <!-- 导航栏 -->
    <div class="navbar">
        <div class="nav-links">
            <button class="nav-btn active" onclick="switchTab('workshop')">🎨 套组工坊</button>
            <button class="nav-btn" onclick="switchTab('gacha')">✨ 抽卡中心</button>
            <button class="nav-btn" onclick="switchTab('collection')">📖 集卡册</button>
        </div>

        <div class="user-assets">
            <div class="coin-display">💰 <span id="coinAmount">0</span></div>
            <button class="claim-btn" onclick="claimDailyCoins()">领取每日 100 金币</button>
        </div>
    </div>

    <div class="container">

        <!-- 选项卡 1：套组工坊 -->
        <div id="workshop" class="tab-pane active">
            <div class="workshop-panel">
                <h2 style="color: #ffd700;">✨ 卡片套组（卡包）工坊</h2>
                <p style="font-size: 13px; color: #a0a0ab;">在这里制作你的专属卡包。选择模板并填满卡片后，消耗 <b>30 金币</b>发布至云端全局卡池供所有人抽取！</p>
                
                <div class="input-group" style="max-width: 300px;">
                    <label>卡包名称</label>
                    <input type="text" id="packTitleInput" value="我的第一套卡包" placeholder="请输入卡包名称">
                </div>

                <div class="template-selector">
                    <span style="font-size: 13px; font-weight: bold;">选择套组模板：</span>
                    <div class="template-card selected" id="tplMini" onclick="selectTemplate('mini')">
                        <strong>小型包</strong> (2张 N + 1张 SR)
                    </div>
                    <div class="template-card" id="tplStandard" onclick="selectTemplate('standard')">
                        <strong>标准包</strong> (3张 N + 2张 SR + 1张 SSR)
                    </div>
                </div>

                <!-- 动态槽位填空区 -->
                <div class="slots-grid" id="slotsGrid"></div>

                <button class="action-btn" onclick="publishSetToCloud()">🚀 消耗 30 金币发布整套卡包到云端</button>
                <div id="workshopTip" style="font-size: 13px; text-align: center; min-height: 18px;"></div>
            </div>
        </div>

        <!-- 选项卡 2：抽卡中心 -->
        <div id="gacha" class="tab-pane">
            <div class="gacha-layout">
                <!-- 左侧：卡包选择列表 -->
                <div class="pack-list-panel">
                    <h3 style="font-size: 15px; color: #ffd700; margin-bottom: 5px;">📦 选择抽卡卡包</h3>
                    <div id="packSelectionContainer" style="display: flex; flex-direction: column; gap: 10px;">
                        <!-- 动态加载云端卡包 -->
                    </div>
                </div>

                <!-- 右侧：抽卡操作区 -->
                <div class="gacha-box">
                    <div>
                        <h2 style="color: #ffd700; margin-bottom: 5px;" id="selectedPackTitle">正在加载卡包...</h2>
                        <p style="color: #a0a0ab; font-size: 13px;" id="selectedPackDesc">单抽 10 金币 | 五连抽 45 金币</p>
                    </div>
                    
                    <div class="gacha-result" id="gachaResult">
                        <p style="color: #666;">请在左侧选择一个卡包，然后点击下方按钮开始抽卡</p>
                    </div>

                    <div style="display: flex; gap: 15px; justify-content: center;">
                        <button class="action-btn" onclick="startGacha(1)">🔮 单抽 (10金币)</button>
                        <button class="action-btn" onclick="startGacha(5)" style="background: linear-gradient(135deg, #00c6ff, #0072ff); color: #fff;">💫 五连抽 (45金币)</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 选项卡 3：集卡册 -->
        <div id="collection" class="tab-pane">
            <div style="display: flex; justify-content: space-between; width: 100%; align-items: center; margin-bottom: 10px;">
                <h2 style="color: #ffd700;">📖 我的集卡册 (仅存放抽到的卡)</h2>
                <span style="font-size: 12px; color: #a0a0ab;">分解返还：N卡=2金币 | SR卡=5金币 | SSR卡=20金币</span>
            </div>
            <div class="collection-grid" id="collectionGrid"></div>
        </div>

    </div>

    <script>
        // ==========================================
        // 1. Supabase 客户端配置 (请在此处填入你的真实参数)
        // ==========================================
        const SUPABASE_URL = 'https://mjimhvgxmdfxsaxrovgk.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_Nen01dKziVN6GjzWs_3yxw_2n3Y62Gt';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // 默认官方卡包（作为初始兜底）
        const defaultPack = {
            id: 'official_default',
            title: '🌟 官方经典初始卡包',
            description: '系统自带的基础卡包，内含经典测试卡片',
            cards: [
                { id: 101, name: "星空幻境", rarity: "SSR", image: "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=400&auto=format&fit=crop", desc: "随鼠标旋转流转的全息反光卡面。" },
                { id: 102, name: "霓虹街区", rarity: "SR", image: "https://images.unsplash.com/photo-1519681393784-d120267933ba?q=80&w=400&auto=format&fit=crop", desc: "赛博朋克风格的未来都市夜景。" },
                { id: 103, name: "初级史莱姆", rarity: "N", image: "https://images.unsplash.com/photo-1534447677768-be436bb09401?q=80&w=400&auto=format&fit=crop", desc: "到处可见的软萌生物。" }
            ]
        };

        const templates = {
            mini: [
                { rarity: 'N', name: '新手卡 N-1', desc: '小型包专属N卡', image: 'https://images.unsplash.com/photo-1534447677768-be436bb09401?q=80&w=400&auto=format&fit=crop', file: null },
                { rarity: 'N', name: '新手卡 N-2', desc: '小型包专属N卡', image: 'https://images.unsplash.com/photo-1534447677768-be436bb09401?q=80&w=400&auto=format&fit=crop', file: null },
                { rarity: 'SR', name: '进阶卡 SR-1', desc: '小型包专属SR卡', image: 'https://images.unsplash.com/photo-1519681393784-d120267933ba?q=80&w=400&auto=format&fit=crop', file: null }
            ],
            standard: [
                { rarity: 'N', name: '标准卡 N-1', desc: '标准包N卡', image: 'https://images.unsplash.com/photo-1534447677768-be436bb09401?q=80&w=400&auto=format&fit=crop', file: null },
                { rarity: 'N', name: '标准卡 N-2', desc: '标准包N卡', image: 'https://images.unsplash.com/photo-1534447677768-be436bb09401?q=80&w=400&auto=format&fit=crop', file: null },
                { rarity: 'N', name: '标准卡 N-3', desc: '标准包N卡', image: 'https://images.unsplash.com/photo-1534447677768-be436bb09401?q=80&w=400&auto=format&fit=crop', file: null },
                { rarity: 'SR', name: '精英卡 SR-1', desc: '标准包SR卡', image: 'https://images.unsplash.com/photo-1519681393784-d120267933ba?q=80&w=400&auto=format&fit=crop', file: null },
                { rarity: 'SR', name: '精英卡 SR-2', desc: '标准包SR卡', image: 'https://images.unsplash.com/photo-1519681393784-d120267933ba?q=80&w=400&auto=format&fit=crop', file: null },
                { rarity: 'SSR', name: '传说卡 SSR-1', desc: '标准包终极SSR卡', image: 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=400&auto=format&fit=crop', file: null }
            ]
        };

        let currentTemplateKey = 'mini';
        let currentDraftSlots = JSON.parse(JSON.stringify(templates.mini));
        let cloudPacks = [defaultPack];
        let selectedPack = defaultPack;

        // --- 本地经济资产管理 ---
        function getCoins() {
            let coins = localStorage.getItem('myCoins');
            if (coins === null) { coins = 100; localStorage.setItem('myCoins', coins); }
            return parseInt(coins);
        }
        function setCoins(amount) {
            localStorage.setItem('myCoins', amount);
            document.getElementById('coinAmount').textContent = amount;
        }
        function getInventory() {
            let inv = JSON.parse(localStorage.getItem('myInventory'));
            if (!inv) { 
                inv = { 101: { card: defaultPack.cards[0], count: 1 } }; 
                localStorage.setItem('myInventory', JSON.stringify(inv)); 
            }
            return inv;
        }

        document.getElementById('coinAmount').textContent = getCoins();

        function claimDailyCoins() {
            const lastClaim = localStorage.getItem('lastClaimDate');
            const today = new Date().toDateString();
            if (lastClaim === today) { alert("今天已经领取过了！"); return; }
            setCoins(getCoins() + 100);
            localStorage.setItem('lastClaimDate', today);
            alert("成功领取 100 金币！");
        }

        function switchTab(tabId) {
            document.querySelectorAll('.tab-pane').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            event.target.classList.add('active');
            
            if (tabId === 'gacha') {
                fetchCloudPacksAndRender();
            }
            if (tabId === 'collection') {
                renderCollection();
            }
        }

        // --- 1. 套组工坊逻辑 ---
        function selectTemplate(key) {
            currentTemplateKey = key;
            currentDraftSlots = JSON.parse(JSON.stringify(templates[key]));
            document.getElementById('tplMini').className = `template-card ${key === 'mini' ? 'selected' : ''}`;
            document.getElementById('tplStandard').className = `template-card ${key === 'standard' ? 'selected' : ''}`;
            renderWorkshopSlots();
        }

        function renderWorkshopSlots() {
            const grid = document.getElementById('slotsGrid');
            grid.innerHTML = '';

            currentDraftSlots.forEach((slot, index) => {
                const box = document.createElement('div');
                box.className = 'slot-card-box';
                box.innerHTML = `
                    <div class="slot-header">槽位 #${index + 1} [稀有度：${slot.rarity}]</div>
                    <div style="display: flex; gap: 15px; align-items: center;">
                        <div class="card-container slot-preview-card" style="width: 120px; height: 170px;">
                            <div class="card ${slot.rarity.toLowerCase()}" style="width: 120px; height: 170px;">
                                <div class="card-content" style="padding: 6px;">
                                    <div class="card-header" style="font-size: 10px;"><span>${slot.rarity}</span><span>#SLOT</span></div>
                                    <div class="card-image-box" style="height: 75px;"><img id="img_preview_${index}" src="${slot.image}" alt=""></div>
                                    <div class="card-footer"><h3 id="name_preview_${index}" style="font-size: 11px;">${slot.name}</h3><p id="desc_preview_${index}" style="font-size: 8px;">${slot.desc}</p></div>
                                </div>
                                <div class="card-shine"></div>
                            </div>
                        </div>
                        <div style="flex: 1; display: flex; flex-direction: column; gap: 6px;">
                            <div class="input-group">
                                <label>卡片名称</label>
                                <input type="text" id="input_name_${index}" value="${slot.name}" oninput="updateSlotData(${index}, 'name', this.value)">
                            </div>
                            <div class="input-group">
                                <label>卡面图片上传</label>
                                <input type="file" accept="image/*" onchange="handleSlotImageSelect(${index}, this)">
                            </div>
                            <div class="input-group">
                                <label>卡片描述</label>
                                <textarea oninput="updateSlotData(${index}, 'desc', this.value)">${slot.desc}</textarea>
                            </div>
                        </div>
                    </div>
                `;
                grid.appendChild(box);
                bindCard3D(box.querySelector('.slot-preview-card'), box.querySelector('.card'), box.querySelector('.card-shine'));
            });
        }

        function updateSlotData(index, field, value) {
            currentDraftSlots[index][field] = value;
            if (field === 'name') document.getElementById(`name_preview_${index}`).textContent = value || '未命名';
            if (field === 'desc') document.getElementById(`desc_preview_${index}`).textContent = value || '暂无描述';
        }

        function handleSlotImageSelect(index, inputElement) {
            const file = inputElement.files[0];
            if (file) {
                currentDraftSlots[index].file = file; // 暂存文件对象用于后续上传 Supabase Storage
                const reader = new FileReader();
                reader.onload = ev => {
                    currentDraftSlots[index].image = ev.target.result;
                    document.getElementById(`img_preview_${index}`).src = ev.target.result;
                };
                reader.readAsDataURL(file);
            }
        }

        function bindCard3D(container, cardElement, shineElement) {
            container.addEventListener('mousemove', (e) => {
                const rect = container.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const rotateX = -((y - rect.height/2) / (rect.height/2)) * 15;
                const rotateY = ((x - rect.width/2) / (rect.width/2)) * 15;
                cardElement.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale(1.05)`;
                shineElement.style.opacity = '0.8';
                shineElement.style.background = `radial-gradient(circle at ${(x/rect.width)*100}% ${(y/rect.height)*100}%, rgba(255,255,255,0.8) 0%, rgba(255,100,200,0.3) 30%, transparent 70%)`;
            });
            container.addEventListener('mouseleave', () => {
                cardElement.style.transform = 'rotateX(0deg) rotateY(0deg) scale(1)';
                shineElement.style.opacity = '0';
            });
        }

        // --- 核心：将图片上传至 Supabase Storage 并发布卡包到云端数据库 ---
        async function publishSetToCloud() {
            const cost = 30;
            const currentCoins = getCoins();
            const tip = document.getElementById('workshopTip');
            const packTitle = document.getElementById('packTitleInput').value.trim() || '未命名卡包';

            if (currentCoins < cost) {
                tip.style.color = '#e74c3c';
                tip.textContent = `金币不足！发布套组需要 ${cost} 金币，你当前只有 ${currentCoins} 金币。`;
                return;
            }

            tip.style.color = '#ffd700';
            tip.textContent = '正在上传图片并同步到云端数据库，请稍候...';

            try {
                // 1. 遍历槽位，将玩家上传的图片文件依次存入 Supabase Storage 存储桶
                let processedCards = [];
                for (let i = 0; i < currentDraftSlots.length; i++) {
                    let slot = currentDraftSlots[i];
                    let imageUrl = slot.image;

                    if (slot.file) {
                        const fileExt = slot.file.name.split('.').pop();
                        const fileName = `${Date.now()}_${Math.random().toString(36).substring(2, 9)}.${fileExt}`;
                        
                        // 调用 Supabase Storage 上传
                        const { data: uploadData, error: uploadError } = await supabase.storage
                            .from('card-images')
                            .upload(fileName, slot.file);

                        if (uploadError) throw new Error(`图片 ${i+1} 上传失败: ` + uploadError.message);

                        // 获取公开访问 URL
                        const { data: { publicUrl } } = supabase.storage
                            .from('card-images')
                            .getPublicUrl(fileName);
                        
                        imageUrl = publicUrl;
                    }

                    processedCards.push({
                        id: Date.now() + i,
                        name: slot.name,
                        rarity: slot.rarity,
                        image: imageUrl,
                        desc: slot.desc
                    });
                }

                // 2. 将整个卡包数据写入 Supabase `card_packs` 数据库表
                const { error: dbError } = await supabase
                    .from('card_packs')
                    .insert([
                        { 
                            title: packTitle, 
                            description: `包含 ${processedCards.length} 张定制卡片的玩家套组`,
                            cards: processedCards 
                        }
                    ]);

                if (dbError) throw new Error('云端数据库写入失败: ' + dbError.message);

                // 3. 扣除金币并提示成功
                setCoins(currentCoins - cost);
                tip.style.color = '#4cd137';
                tip.textContent = '🎉 发布成功！整套卡包已成功同步至云端，所有玩家都可以在抽卡中心抽取它了！';
                setTimeout(() => { tip.textContent = ''; }, 4000);

            } catch (err) {
                console.error(err);
                tip.style.color = '#e74c3c';
                tip.textContent = '发布失败: ' + err.message;
            }
        }

        renderWorkshopSlots();

        // --- 2. 抽卡中心逻辑（从 Supabase 加载卡包并定向抽取） ---
        async function fetchCloudPacksAndRender() {
            const container = document.getElementById('packSelectionContainer');
            container.innerHTML = '<p style="font-size: 12px; color: #a0a0ab;">正在从云端同步卡包...</p>';

            try {
                const { data, error } = await supabase.from('card_packs').select('*');
                if (error) throw error;

                cloudPacks = [defaultPack];
                if (data && data.length > 0) {
                    data.forEach(row => {
                        cloudPacks.push({
                            id: row.id,
                            title: row.title,
                            description: row.description,
                            cards: row.cards
                        });
                    });
                }
            } catch (err) {
                console.warn('从云端加载卡包失败，使用默认卡包', err);
            }

            renderPackList();
        }

        function renderPackList() {
            const container = document.getElementById('packSelectionContainer');
            container.innerHTML = '';

            cloudPacks.forEach(pack => {
                const item = document.createElement('div');
                item.className = `pack-item ${selectedPack.id === pack.id ? 'selected' : ''}`;
                item.innerHTML = `
                    <div style="font-weight: bold; font-size: 13px; color: #ffd700;">${pack.title}</div>
                    <div style="font-size: 11px; color: #a0a0ab; margin-top: 2px;">包含卡片: ${pack.cards.length}张</div>
                `;
                item.onclick = () => selectPack(pack);
                container.appendChild(item);
            });

            // 默认选中第一个
            if (!cloudPacks.some(p => p.id === selectedPack.id)) {
                selectedPack = cloudPacks[0];
            }
            updateSelectedPackUI();
        }

        function selectPack(pack) {
            selectedPack = pack;
            renderPackList();
        }

        function updateSelectedPackUI() {
            document.getElementById('selectedPackTitle').textContent = selectedPack.title;
            document.getElementById('selectedPackDesc').textContent = selectedPack.description || '定向抽取该卡包内的专属卡片';
        }

        let pendingDrawCount = 1;

        function startGacha(count) {
            const cost = count === 1 ? 10 : 45;
            const currentCoins = getCoins();

            if (currentCoins < cost) {
                alert(`金币不足！抽卡需要 ${cost} 金币，你当前有 ${currentCoins} 金币。`);
                return;
            }

            setCoins(currentCoins - cost);
            pendingDrawCount = count;
            document.getElementById('gachaOverlay').style.display = 'flex';
            document.getElementById('summonTip').textContent = count === 1 ? "消耗 10 金币，感应单抽能量..." : "消耗 45 金币，感应五连星光...";
        }

        function finishSummonAnimation() {
            document.getElementById('gachaOverlay').style.display = 'none';

            const resultBox = document.getElementById('gachaResult');
            resultBox.innerHTML = '';
            
            let inv = getInventory();
            let drawnCards = [];
            let pool = selectedPack.cards; // 严格只在当前选中的卡包内部卡片池中抽取！

            for (let i = 0; i < pendingDrawCount; i++) {
                const rand = Math.random() * 100;
                let targetRarity = 'N';
                if (rand < 5) targetRarity = 'SSR';
                else if (rand < 30) targetRarity = 'SR';

                let filtered = pool.filter(c => c.rarity === targetRarity);
                if (filtered.length === 0) filtered = pool; // 兜底

                const drawn = filtered[Math.floor(Math.random() * filtered.length)];
                drawnCards.push(drawn);

                // 只有抽到的卡片才正式存入集卡册
                if (inv[drawn.id]) { inv[drawn.id].count++; } 
                else { inv[drawn.id] = { card: drawn, count: 1 }; }
            }

            localStorage.setItem('myInventory', JSON.stringify(inv));

            drawnCards.forEach((drawn, index) => {
                const cardHtml = document.createElement('div');
                cardHtml.className = 'card-container gacha-card-item reveal-anim';
                cardHtml.style.animationDelay = `${index * 0.15}s`;
                cardHtml.innerHTML = `
                    <div class="card ${drawn.rarity.toLowerCase()}">
                        <div class="card-content">
                            <div class="card-header"><span>${drawn.rarity}</span><span>#${drawn.id.toString().slice(-4)}</span></div>
                            <div class="card-image-box"><img src="${drawn.image}" alt=""></div>
                            <div class="card-footer"><h3>${drawn.name}</h3><p>${drawn.desc}</p></div>
                        </div>
                        <div class="card-shine"></div>
                    </div>
                `;
                resultBox.appendChild(cardHtml);
            });

            setTimeout(() => {
                document.querySelectorAll('.gacha-card-item').forEach(item => {
                    const cardEl = item.querySelector('.card');
                    const shineEl = item.querySelector('.card-shine');
                    bindCard3D(item, cardEl, shineEl);
                });
            }, 300 + pendingDrawCount * 150);
        }

        // --- 3. 集卡册与分解逻辑 ---
        function renderCollection() {
            const grid = document.getElementById('collectionGrid');
            const inv = getInventory();
            grid.innerHTML = '';

            const keys = Object.keys(inv);
            if (keys.length === 0) {
                grid.innerHTML = '<p style="color: #666; grid-column: 1/-1; text-align: center;">集卡册空空如也，快去抽卡获取卡片吧！</p>';
                return;
            }

            keys.forEach(key => {
                const item = inv[key];
                if (item.count <= 0) return;

                const c = item.card;
                const wrapper = document.createElement('div');
                wrapper.className = 'collection-card-wrapper';

                let recycleValue = 2;
                if (c.rarity === 'SR') recycleValue = 5;
                if (c.rarity === 'SSR') recycleValue = 20;

                wrapper.innerHTML = `
                    <div class="card-container col-card" style="width: 200px; height: 290px;">
                        <div class="card ${c.rarity.toLowerCase()}" style="width: 200px; height: 290px;">
                            <div class="card-content" style="padding: 10px;">
                                <div class="card-header" style="font-size: 12px;"><span>${c.rarity}</span><span>#${c.id.toString().slice(-4)}</span></div>
                                <div class="card-image-box" style="height: 130px;"><img src="${c.image}" alt=""></div>
                                <div class="card-footer"><h3 style="font-size: 13px;">${c.name}</h3><p style="font-size: 10px;">${c.desc}</p></div>
                            </div>
                            <div class="card-shine"></div>
                        </div>
                    </div>
                    <div class="card-meta">
                        <span class="card-count">x${item.count}</span>
                        <button class="recycle-btn" onclick="recycleCard(${c.id}, ${recycleValue})">分解 (+${recycleValue}💰)</button>
                    </div>
                `;
                grid.appendChild(wrapper);
                bindCard3D(wrapper.querySelector('.col-card'), wrapper.querySelector('.card'), wrapper.querySelector('.card-shine'));
            });
        }

        function recycleCard(cardId, refundCoins) {
            let inv = getInventory();
            if (inv[cardId] && inv[cardId].count > 0) {
                inv[cardId].count--;
                if (inv[cardId].count === 0) delete inv[cardId];
                localStorage.setItem('myInventory', JSON.stringify(inv));
                setCoins(getCoins() + refundCoins);
                renderCollection();
            }
        }
    </script>
</body>
</html>
