<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>网页抽卡工具 - Supabase 联网多端版</title>
    <!-- 引入 Supabase 客户端 SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #121214;
            color: #fff;
            min-height: 100vh;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 顶部导航栏 & 资产栏 */
        .navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #1a1a22;
            padding: 12px 30px;
            border-bottom: 1px solid #2f2f3d;
            width: 100%;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-links {
            display: flex;
            gap: 15px;
        }

        .nav-btn {
            background: #2b2b36;
            color: #a0a0ab;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }

        .nav-btn.active {
            background: linear-gradient(135deg, #ffd700, #ff9900);
            color: #121214;
            box-shadow: 0 4px 15px rgba(255, 215, 0, 0.3);
        }

        .user-assets {
            display: flex;
            align-items: center;
            gap: 12px;
            background: #252530;
            padding: 6px 16px;
            border-radius: 20px;
            border: 1px solid #3a3a4c;
        }

        .coin-display {
            color: #ffd700;
            font-weight: bold;
            font-size: 16px;
        }

        .claim-btn {
            background: #4cd137;
            color: #121214;
            border: none;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
        }

        /* 页面主体容器 */
        .container {
            max-width: 1100px;
            width: 100%;
            padding: 30px 20px;
            display: flex;
            justify-content: center;
        }

        .tab-pane {
            display: none;
            width: 100%;
        }

        .tab-pane.active {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        /* 公共卡片样式 */
        .card-container {
            perspective: 1000px;
        }

        .card {
            width: 220px;
            height: 320px;
            background: #1e1e24;
            border-radius: 16px;
            position: relative;
            transform-style: preserve-3d;
            transition: box-shadow 0.3s ease;
            -webkit-font-smoothing: antialiased;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 2px solid rgba(255, 215, 0, 0.4);
        }

        .card.n { border-color: rgba(160, 160, 171, 0.6); }
        .card.sr { border-color: rgba(64, 156, 255, 0.8); }
        .card.ssr { border-color: rgba(255, 215, 0, 1); box-shadow: 0 0 20px rgba(255, 215, 0, 0.4); }

        .card-content {
            position: absolute;
            inset: 0;
            padding: 12px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            background: linear-gradient(135deg, #2b2b36 0%, #15151a 100%);
            border-radius: 14px;
            z-index: 1;
            pointer-events: none;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            font-size: 13px;
        }
        .card.n .card-header { color: #a0a0ab; }
        .card.sr .card-header { color: #409cff; }
        .card.ssr .card-header { color: #ffd700; }

        .card-image-box {
            width: 100%;
            height: 150px;
            border-radius: 8px;
            overflow: hidden;
            background: #000;
            position: relative;
        }

        .card-image-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card-footer h3 {
            font-size: 14px;
            margin-bottom: 2px;
            color: #fff;
        }

        .card-footer p {
            font-size: 10px;
            color: #a0a0ab;
            line-height: 1.2;
            height: 24px;
            overflow: hidden;
        }

        .card-shine {
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            mix-blend-mode: screen;
        }

        /* 1. 套组工坊样式 */
        .workshop-panel {
            background: #1a1a22;
            padding: 30px;
            border-radius: 20px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .template-selector {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .template-card {
            background: #2b2b36;
            border: 2px solid #3f3f4e;
            padding: 12px 20px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .template-card.selected {
            border-color: #ffd700;
            background: #353545;
        }

        .slots-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(min(100%, 360px), 1fr));
            gap: 20px;
        }

        .slot-card-box {
            background: #252530;
            border: 1px solid #3a3a4c;
            padding: 15px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            min-width: 0;
        }
        .slot-main { display: flex; gap: 15px; align-items: flex-start; }
        .slot-preview-card { flex: none; }
        .slot-fields { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
        .fx-panel {
            border-top: 1px dashed #3f3f4e;
            padding-top: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            min-width: 0;
        }
        .fx-row label { display: flex; justify-content: space-between; font-size: 11px; color: #a0a0ab; }
        .fx-row input[type=range] { width: 100%; accent-color: #ffd700; }
        .fx-tex-status { font-size: 10px; color: #4cd137; }

        .slot-header {
            font-size: 13px;
            color: #ffd700;
            font-weight: bold;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .input-group { min-width: 0; }
        .input-group label { font-size: 11px; color: #a0a0ab; }
        .input-group input, .input-group textarea, .input-group select {
            background: #1e1e24; border: 1px solid #3f3f4e; padding: 6px 10px; border-radius: 6px; color: #fff; font-size: 12px;
            width: 100%; min-width: 0; max-width: 100%;
        }
        .input-group input[type=file] { padding: 4px; font-size: 11px; }
        .input-group textarea { resize: none; height: 45px; }

        .action-btn {
            background: linear-gradient(135deg, #ffd700, #ff9900);
            color: #121214; border: none; padding: 12px 24px; border-radius: 8px;
            font-weight: bold; font-size: 15px; cursor: pointer; align-self: center;
        }
        .action-btn:hover { opacity: 0.9; }

        /* 2. 抽卡中心样式 */
        .gacha-layout {
            display: flex;
            gap: 30px;
            width: 100%;
        }

        .pack-list-panel {
            width: 280px;
            background: #1a1a22;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 500px;
            overflow-y: auto;
        }

        .pack-item {
            background: #252530;
            border: 1px solid #3a3a4c;
            padding: 12px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .pack-item.selected {
            border-color: #ffd700;
            background: #353545;
        }

        .gacha-box {
            flex: 1;
            text-align: center;
            background: #1a1a22;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .gacha-result {
            display: flex;
            justify-content: center;
            gap: 15px;
            min-height: 320px;
            align-items: center;
            margin: 15px 0;
            flex-wrap: wrap;
        }

        #gachaOverlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(10, 10, 12, 0.92);
            z-index: 1000;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .summon-orb {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            background: radial-gradient(circle, #fff 0%, #ffd700 40%, #ff4500 80%, #111 100%);
            box-shadow: 0 0 60px #ffd700, 0 0 120px #ff4500;
            animation: orbPulse 1.2s infinite alternate ease-in-out;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 16px;
            color: #1a1a22;
        }

        @keyframes orbPulse {
            0% { transform: scale(1); box-shadow: 0 0 40px #ffd700, 0 0 80px #ff4500; }
            100% { transform: scale(1.12); box-shadow: 0 0 80px #ffea79, 0 0 150px #ff2e00; }
        }

        .card-container.reveal-anim {
            animation: cardPopIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) backwards;
        }

        @keyframes cardPopIn {
            0% { opacity: 0; transform: scale(0.3) translateY(100px) rotateX(20deg); }
            100% { opacity: 1; transform: none; }
        }

        .pack-contents {
            text-align: left;
            background: #15151c;
            border: 1px solid #2f2f3d;
            border-radius: 12px;
            padding: 12px;
            margin-top: 12px;
        }
        .pack-contents h4 { font-size: 13px; color: #ffd700; margin-bottom: 8px; }
        .rate-summary { display: flex; gap: 12px; font-size: 12px; margin-bottom: 8px; flex-wrap: wrap; }
        .pc-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px; max-height: 190px; overflow-y: auto; }
        .pc-item { display: flex; gap: 8px; align-items: center; background: #1e1e26; border-radius: 8px; padding: 6px; min-width: 0; }
        .pc-item img { width: 40px; height: 40px; object-fit: cover; border-radius: 6px; flex: none; }
        .pc-info { min-width: 0; font-size: 12px; }
        .pc-info b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .pc-info span { font-size: 11px; color: #a0a0ab; }
        .r-N { color: #a0a0ab; } .r-SR { color: #409cff; } .r-SSR { color: #ffd700; }

        /* 3. 集卡册样式 */
        .collection-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
            width: 100%;
        }
        .collection-card-wrapper {
            background: #1a1a22;
            padding: 15px;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.4);
        }
        .card-meta {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 5px;
        }
        .card-count { font-size: 13px; color: #ffd700; font-weight: bold; }
        .recycle-btn {
            background: #e74c3c; color: #fff; border: none; padding: 4px 10px; border-radius: 6px; font-size: 11px; cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- 抽卡演出遮罩 -->
    <div id="gachaOverlay">
        <div class="summon-orb" onclick="finishSummonAnimation()">✨ 点击开启</div>
        <p style="color: #a0a0ab; margin-top: 25px; font-size: 15px;" id="summonTip">命运之轮正在转动...</p>
    </div>

    <!-- 导航栏 -->
    <div class="navbar">
        <div class="nav-links">
            <button class="nav-btn active" onclick="switchTab('workshop')">🎨 套组工坊</button>
            <button class="nav-btn" onclick="switchTab('gacha')">✨ 抽卡中心</button>
            <button class="nav-btn" onclick="switchTab('collection')">📖 集卡册</button>
        </div>

        <div class="user-assets">
            <div class="coin-display">💰 <span id="coinAmount">0</span></div>
            <button class="claim-btn" onclick="claimDailyCoins()">领取每日 100 金币</button>
        </div>
    </div>

    <div class="container">

        <!-- 选项卡 1：套组工坊 -->
        <div id="workshop" class="tab-pane active">
            <div class="workshop-panel">
                <h2 style="color: #ffd700;">✨ 卡片套组（卡包）工坊</h2>
                <p style="font-size: 13px; color: #a0a0ab;">在这里制作你的专属卡包。选择模板并填满卡片后，消耗 <b>30 金币</b>发布至云端全局卡池供所有人抽取！</p>
                
                <div class="input-group" style="max-width: 300px;">
                    <label>卡包名称</label>
                    <input type="text" id="packTitleInput" value="我的第一套卡包" placeholder="请输入卡包名称">
                </div>

                <div class="template-selector">
                    <span style="font-size: 13px; font-weight: bold;">选择套组模板：</span>
                    <div class="template-card selected" id="tplMini" onclick="selectTemplate('mini')">
                        <strong>小型包</strong> (2张 N + 1张 SR)
                    </div>
                    <div class="template-card" id="tplStandard" onclick="selectTemplate('standard')">
                        <strong>标准包</strong> (3张 N + 2张 SR + 1张 SSR)
                    </div>
                </div>

                <!-- 动态槽位填空区 -->
                <div class="slots-grid" id="slotsGrid"></div>

                <button class="action-btn" onclick="publishSetToCloud()">🚀 消耗 30 金币发布整套卡包到云端</button>
                <div id="workshopTip" style="font-size: 13px; text-align: center; min-height: 18px;"></div>
            </div>
        </div>

        <!-- 选项卡 2：抽卡中心 -->
        <div id="gacha" class="tab-pane">
            <div class="gacha-layout">
                <!-- 左侧：卡包选择列表 -->
                <div class="pack-list-panel">
                    <h3 style="font-size: 15px; color: #ffd700; margin-bottom: 5px;">📦 选择抽卡卡包</h3>
                    <div id="packSelectionContainer" style="display: flex; flex-direction: column; gap: 10px;">
                        <!-- 动态加载云端卡包 -->
                    </div>
                </div>

                <!-- 右侧：抽卡操作区 -->
                <div class="gacha-box">
                    <div>
                        <h2 style="color: #ffd700; margin-bottom: 5px;" id="selectedPackTitle">正在加载卡包...</h2>
                        <p style="color: #a0a0ab; font-size: 13px;" id="selectedPackDesc">单抽 10 金币 | 五连抽 45 金币</p>
                    </div>

                    <div class="pack-contents" id="packContents"></div>
                    
                    <div class="gacha-result" id="gachaResult">
                        <p style="color: #666;">请在左侧选择一个卡包，然后点击下方按钮开始抽卡</p>
                    </div>

                    <div style="display: flex; gap: 15px; justify-content: center;">
                        <button class="action-btn" onclick="startGacha(1)">🔮 单抽 (10金币)</button>
                        <button class="action-btn" onclick="startGacha(5)" style="background: linear-gradient(135deg, #00c6ff, #0072ff); color: #fff;">💫 五连抽 (45金币)</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 选项卡 3：集卡册 -->
        <div id="collection" class="tab-pane">
            <div style="display: flex; justify-content: space-between; width: 100%; align-items: center; margin-bottom: 10px;">
                <h2 style="color: #ffd700;">📖 我的集卡册 (仅存放抽到的卡)</h2>
                <span style="font-size: 12px; color: #a0a0ab;">分解返还：N卡=2金币 | SR卡=5金币 | SSR卡=20金币</span>
            </div>
            <div class="collection-grid" id="collectionGrid"></div>
        </div>

    </div>

    <script>
        // ==========================================
        // 1. Supabase 客户端配置 (请在此处填入你的真实参数)
        // ==========================================
        const SUPABASE_URL = 'https://mjimhvgxmdfxsaxrovgk.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_Nen01dKziVN6GjzWs_3yxw_2n3Y62Gt';
        const dbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

        // ==========================================
        // 卡牌特效引擎：共享一个离屏 WebGL 上下文，仅对悬停的卡牌渲染，再拷贝到该卡的 canvas
        // 蒙版/法线/图案贴图与卡面图使用同样的 cover 映射，建议与卡面图同比例
        // ==========================================
        const FX = {
            none: { id: 0, name: '无特效', params: [], tex: [] },
            holo: {
                id: 1, name: '全息彩虹 Holo',
                params: [
                    { label: '强度', min: 0, max: 1.5, step: 0.01, def: 0.8 },
                    { label: '色带密度', min: 0.5, max: 8, step: 0.1, def: 3 },
                    { label: '色相偏移', min: 0, max: 1, step: 0.01, def: 0 },
                    { label: '饱和度', min: 0, max: 1, step: 0.01, def: 0.7 },
                    { label: '色带锐度', min: 0.3, max: 8, step: 0.1, def: 1.5 },
                    { label: '光斑范围', min: 0.1, max: 1.5, step: 0.01, def: 0.6 }
                ],
                tex: [{ k: 'mask', label: '蒙版贴图（白=显示特效，可选）' }]
            },
            galaxy: {
                id: 2, name: '星河 Galaxy',
                params: [
                    { label: '强度', min: 0, max: 1.5, step: 0.01, def: 0.9 },
                    { label: '星点密度', min: 0.3, max: 3, step: 0.05, def: 1 },
                    { label: '视差深度', min: 0, max: 3, step: 0.05, def: 1.2 },
                    { label: '星云浓度', min: 0, max: 2, step: 0.05, def: 0.8 },
                    { label: '色相', min: 0, max: 1, step: 0.01, def: 0.6 },
                    { label: '闪烁', min: 0, max: 1, step: 0.01, def: 0.6 }
                ],
                tex: [{ k: 'mask', label: '蒙版贴图（白=显示特效，可选）' }]
            },
            glitter: {
                id: 3, name: '闪粉 Glitter',
                params: [
                    { label: '强度', min: 0, max: 1.5, step: 0.01, def: 0.9 },
                    { label: '颗粒密度', min: 0.3, max: 3, step: 0.05, def: 1 },
                    { label: '颗粒大小', min: 0.1, max: 1, step: 0.01, def: 0.4 },
                    { label: '色彩多样性', min: 0, max: 1, step: 0.01, def: 0.5 },
                    { label: '闪烁锐度', min: 1, max: 12, step: 0.5, def: 4 },
                    { label: '整体眩光', min: 0, max: 1, step: 0.01, def: 0.4 }
                ],
                tex: [{ k: 'mask', label: '蒙版贴图（白=显示特效，可选）' }]
            },
            foil: {
                id: 4, name: '金属镭射 Foil（法线）',
                params: [
                    { label: '强度', min: 0, max: 1.5, step: 0.01, def: 0.9 },
                    { label: '光泽度', min: 4, max: 160, step: 1, def: 40 },
                    { label: '彩虹程度', min: 0, max: 1, step: 0.01, def: 0.6 },
                    { label: '色相偏移', min: 0, max: 1, step: 0.01, def: 0 },
                    { label: '光源高度', min: 0.2, max: 2, step: 0.01, def: 0.8 },
                    { label: '凹凸强度', min: 0, max: 4, step: 0.05, def: 1.5 }
                ],
                tex: [
                    { k: 'normal', label: '法线贴图（可选，缺省时由卡面图推算）' },
                    { k: 'mask', label: '蒙版贴图（白=显示特效，可选）' }
                ]
            },
            sweep: {
                id: 5, name: '流光扫过 Sweep',
                params: [
                    { label: '强度', min: 0, max: 1.5, step: 0.01, def: 0.8 },
                    { label: '光带宽度', min: 0.02, max: 0.5, step: 0.01, def: 0.12 },
                    { label: '角度', min: 0, max: 180, step: 1, def: 35 },
                    { label: '色相', min: 0, max: 1, step: 0.01, def: 0.12 },
                    { label: '边缘锐度', min: 0.5, max: 4, step: 0.05, def: 1.5 },
                    { label: '副光带', min: 0, max: 1, step: 0.01, def: 0.5 }
                ],
                tex: [{ k: 'mask', label: '蒙版贴图（白=显示特效，可选）' }]
            },
            pattern: {
                id: 6, name: '图案镭射 Pattern',
                params: [
                    { label: '强度', min: 0, max: 1.5, step: 0.01, def: 0.8 },
                    { label: '图案缩放', min: 0.3, max: 6, step: 0.05, def: 1.5 },
                    { label: '视差', min: 0, max: 2, step: 0.01, def: 0.6 },
                    { label: '色相偏移', min: 0, max: 1, step: 0.01, def: 0 },
                    { label: '对比度', min: 0.5, max: 4, step: 0.05, def: 1.6 },
                    { label: '饱和度', min: 0, max: 1, step: 0.01, def: 0.8 }
                ],

                    { k: 'mask', label: '蒙版贴图（白=显示特效，可选）' }
                ]
            }
        };
        const TEX_UNIT = { mask: 1, normal: 2, pattern: 3 };
        const DEFAULT_FX_BY_RARITY = { N: 'sweep', SR: 'holo', SSR: 'foil' };

        const newFx = type => ({ type, p: FX[type].params.map(x => x.def), tex: {} });
        const getFx = card => (card.fx && FX[card.fx.type]) ? card.fx : newFx(DEFAULT_FX_BY_RARITY[card.rarity] || 'none');

        const VERT_SRC = `attribute vec2 aPos; varying vec2 vUv;
        void main(){ vUv = vec2(aPos.x*0.5+0.5, 0.5-aPos.y*0.5); gl_Position = vec4(aPos,0.0,1.0); }`;

        const FRAG_SRC = `precision highp float;
        varying vec2 vUv;
        uniform vec2 uRes; uniform vec2 uMouse; uniform float uTime, uFade, uEffect, uBoxAsp;
        uniform float uP[6];
        uniform sampler2D uBase, uMask, uNormal, uPattern;
        uniform vec4 uHas; uniform vec4 uAsp;

        vec2 cover(vec2 uv, float ta){
            vec2 s = vec2(1.0);
            if (ta > uBoxAsp) s.x = uBoxAsp/ta; else s.y = ta/uBoxAsp;
            return (uv-0.5)*s+0.5;
        }
        vec3 hsv(float h, float s, float v){
            vec3 k = clamp(abs(mod(h*6.0+vec3(0.0,4.0,2.0),6.0)-3.0)-1.0,0.0,1.0);
            return v*mix(vec3(1.0),k,s);
        }
        float hash21(vec2 p){ p = fract(p*vec2(123.34,456.21)); p += dot(p,p+45.32); return fract(p.x*p.y); }
        float vnoise(vec2 p){
            vec2 i=floor(p), f=fract(p); f=f*f*(3.0-2.0*f);
            return mix(mix(hash21(i),hash21(i+vec2(1.0,0.0)),f.x), mix(hash21(i+vec2(0.0,1.0)),hash21(i+vec2(1.0,1.0)),f.x), f.y);
        }
        float fbm(vec2 p){ float v=0.0,a=0.5; for(int i=0;i<4;i++){ v+=a*vnoise(p); p*=2.03; a*=0.5; } return v; }
        float lumAt(vec2 uv){
            if (uHas.x < 0.5) return 0.5;
            return dot(texture2D(uBase, cover(uv,uAsp.x)).rgb, vec3(0.299,0.587,0.114));
        }

        void main(){
            vec2 uv = vUv; vec2 m = uMouse; vec2 d = m-0.5;
            vec2 asp = vec2(uBoxAsp,1.0);
            vec2 p = uv*asp;
            float mask = 1.0;
            if (uHas.y > 0.5) mask = texture2D(uMask, cover(uv,uAsp.y)).r;
            float lum = lumAt(uv);
            vec3 col = vec3(0.0); float a = 0.0;

            if (abs(uEffect-1.0) < 0.5) {
                float t = dot(uv-0.5, vec2(0.8,0.6))*uP[1] + dot(d, vec2(1.6,1.2))*uP[1]*0.5 + uP[2];
                float band = pow(0.5+0.5*sin(t*12.566+1.0), uP[4]);
                col = hsv(fract(t), uP[3], 1.0);
                float glow = smoothstep(uP[5], 0.0, distance(p, m*asp));
                a = uP[0]*(0.25+0.75*band)*(0.35+0.65*glow)*(0.5+lum)*mask;
            } else if (abs(uEffect-2.0) < 0.5) {
                vec3 acc = vec3(0.0);
                for (int i=0;i<3;i++){
                    float fi = float(i);
                    vec2 q = (p + d*uP[2]*(fi+1.0)*0.25) * uP[1]*(8.0+fi*6.0);
                    vec2 c = floor(q); vec2 f = fract(q)-0.5;
                    float r = hash21(c+fi*17.0);
                    vec2 o = (vec2(hash21(c+3.1),hash21(c+7.7))-0.5)*0.6;
                    float s = smoothstep(0.14, 0.0, length(f-o))*step(0.72, r);
                    float tw = mix(1.0, 0.5+0.5*sin(uTime*4.0+r*60.0), uP[5]);
                    acc += s*tw*hsv(fract(uP[4]+r*0.3), 0.35, 1.0);
                }
                float n = fbm(p*2.5 + d*uP[2]*0.6);
                float n2 = fbm(p*5.0 - d*uP[2]*0.3 + 3.0);
                vec3 neb = hsv(fract(uP[4]+n2*0.35), 0.75, 1.0)*n*n*uP[3]*1.6;
                col = acc+neb;
                float mx = max(col.r, max(col.g, col.b));
                col /= max(mx, 0.001);
                a = clamp(mx, 0.0, 1.0)*uP[0]*mask;
            } else if (abs(uEffect-3.0) < 0.5) {
                vec2 q = p*uP[1]*18.0;
                vec2 c = floor(q); vec2 f = fract(q);
                float r = hash21(c);
                vec2 o = vec2(hash21(c+1.7), hash21(c+9.2))*0.6+0.2;
                vec2 g = f-o; float dist = length(g); float sz = uP[2]*0.5;
                float shape = smoothstep(sz, 0.0, dist);
                float cross = smoothstep(sz*0.5, 0.0, min(abs(g.x),abs(g.y)))*smoothstep(sz*2.5, 0.0, dist);
                float ph = sin(dot(d, vec2(r-0.5, hash21(c+4.4)-0.5)*40.0) + r*6.283 + uTime*1.5);
                float vis = pow(clamp(ph*0.5+0.5, 0.0, 1.0), uP[4]);
                float sp = (shape+cross*0.6)*vis*step(0.3, r);
                col = mix(vec3(1.0), hsv(fract(r*3.0), 0.7, 1.0), uP[3]);
                float glare = smoothstep(0.8, 0.0, distance(p, m*asp))*uP[5]*0.3;
                a = clamp(sp*(0.4+lum) + glare*lum, 0.0, 1.0)*uP[0]*mask;
            } else if (abs(uEffect-4.0) < 0.5) {
                vec3 n;
                if (uHas.z > 0.5) {
                    n = texture2D(uNormal, cover(uv,uAsp.z)).rgb*2.0-1.0;
                    n.xy *= uP[5];
                    n = normalize(vec3(n.xy, max(n.z,0.2)));
                } else {
                    vec2 e = 1.5/uRes;
                    float dx = lumAt(uv+vec2(e.x,0.0)) - lumAt(uv-vec2(e.x,0.0));
                    float dy = lumAt(uv+vec2(0.0,e.y)) - lumAt(uv-vec2(0.0,e.y));
                    n = normalize(vec3(-dx*uP[5]*3.0, dy*uP[5]*3.0, 1.0));
                }
                vec3 L = normalize(vec3((m.x-uv.x)*uBoxAsp, -(m.y-uv.y), uP[4]));
                vec3 H = normalize(L+vec3(0.0,0.0,1.0));
                float spec = pow(max(dot(n,H),0.0), uP[1]);
                vec3 film = hsv(fract(uP[3] + dot(n.xy, vec2(1.2,0.9))*1.5 + dot(d, vec2(0.6,0.4))), 0.85, 1.0);
                col = mix(vec3(1.0), film, clamp(uP[2],0.0,1.0));
                float diff = pow(max(dot(n,L),0.0), 2.0);
                a = clamp(spec*1.5 + uP[2]*0.4*diff*(0.3+lum), 0.0, 1.0)*uP[0]*mask;
            } else if (abs(uEffect-5.0) < 0.5) {
                float ang = radians(uP[2]); vec2 dir = vec2(cos(ang), sin(ang));
                float x = dot((uv-0.5)*asp, dir) - dot(d, dir)*1.5;
                float w = uP[1];
                float b1 = exp(-pow(abs(x)/w, uP[4]*2.0));
                float b2 = exp(-pow(abs(x+w*2.6)/(w*0.5), uP[4]*2.0))*uP[5];
                col = hsv(uP[3], 0.45, 1.0);
                a = clamp((b1+b2*0.6)*(0.6+0.8*lum), 0.0, 1.0)*uP[0]*mask;
            } else if (abs(uEffect-6.0) < 0.5) {
                vec2 pu = (uv-0.5)*asp*uP[1] + 0.5 + d*uP[2]*0.5;
                float v;
                if (uHas.w > 0.5) {
                    v = dot(texture2D(uPattern, fract(pu)).rgb, vec3(0.3333));
                } else {
                    v = abs(sin((pu.x+pu.y)*18.0))*abs(sin((pu.x-pu.y)*18.0));
                }
                v = clamp((v-0.5)*uP[4]+0.5, 0.0, 1.0);
                col = hsv(fract(uP[3] + v*0.5 + dot(d, vec2(1.2,0.8))), uP[5], 1.0);
                a = clamp(v*(0.4+lum*0.8), 0.0, 1.0)*uP[0]*mask;
            }
            a = clamp(a, 0.0, 1.0)*uFade;
            gl_FragColor = vec4(col*a, a);
        }`;

        const fxGL = (() => {
            const canvas = document.createElement('canvas');
            const gl = canvas.getContext('webgl', { premultipliedAlpha: true, alpha: true });
            if (!gl) return null;
            const compile = (type, src) => {
                const s = gl.createShader(type);
                gl.shaderSource(s, src); gl.compileShader(s);
                if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) { console.error(gl.getShaderInfoLog(s)); return null; }
                return s;
            };
            const vs = compile(gl.VERTEX_SHADER, VERT_SRC), fs = compile(gl.FRAGMENT_SHADER, FRAG_SRC);
            if (!vs || !fs) return null;
            const prog = gl.createProgram();
            gl.attachShader(prog, vs); gl.attachShader(prog, fs); gl.linkProgram(prog);
            if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) { console.error(gl.getProgramInfoLog(prog)); return null; }
            gl.useProgram(prog);
            const buf = gl.createBuffer();
            gl.bindBuffer(gl.ARRAY_BUFFER, buf);
            gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
            const loc = gl.getAttribLocation(prog, 'aPos');
            gl.enableVertexAttribArray(loc);
            gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
            const u = {};
            ['uRes', 'uMouse', 'uTime', 'uFade', 'uEffect', 'uBoxAsp', 'uP', 'uHas', 'uAsp', 'uBase', 'uMask', 'uNormal', 'uPattern']
                .forEach(n => u[n] = gl.getUniformLocation(prog, n));
            gl.uniform1i(u.uBase, 0); gl.uniform1i(u.uMask, 1); gl.uniform1i(u.uNormal, 2); gl.uniform1i(u.uPattern, 3);
            const blank = gl.createTexture();
            gl.bindTexture(gl.TEXTURE_2D, blank);
            gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 1, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, new Uint8Array([0, 0, 0, 255]));
            return { canvas, gl, u, blank };
        })();

        const texCache = new Map();
        function getTex(url) {
            if (!url || !fxGL) return null;
            let e = texCache.get(url);
            if (!e) {
                e = { tex: null, w: 1, h: 1, ready: false };
                texCache.set(url, e);
                const img = new Image();
                img.crossOrigin = 'anonymous';
                img.onload = () => {
                    try {
                        const gl = fxGL.gl;
                        const t = gl.createTexture();
                        gl.bindTexture(gl.TEXTURE_2D, t);
                        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
                        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
                        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
                        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
                        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, img);
                        e.tex = t; e.w = img.naturalWidth; e.h = img.naturalHeight; e.ready = true;
                    } catch (err) { console.warn('特效贴图加载失败', err); }
                };
                img.src = url;
            }
            return e.ready ? e : null;
        }

        function renderFx(cv, card, mx, my, fade) {
            const ctx = cv.getContext('2d');
            const fx = getFx(card), def = FX[fx.type];
            if (!fxGL || !def || !def.id || fade <= 0.001) { ctx.clearRect(0, 0, cv.width, cv.height); return; }
            const { gl, canvas, u, blank } = fxGL;
            const dpr = Math.min(window.devicePixelRatio || 1, 2);
            const w = Math.max(1, Math.round(cv.clientWidth * dpr)), h = Math.max(1, Math.round(cv.clientHeight * dpr));
            if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
            if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
            gl.viewport(0, 0, w, h);
            gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT);

            const has = [0, 0, 0, 0], asp = [1, 1, 1, 1];
            const bind = (unit, e, idx) => {
                gl.activeTexture(gl.TEXTURE0 + unit);
                gl.bindTexture(gl.TEXTURE_2D, e ? e.tex : blank);
                if (e) { has[idx] = 1; asp[idx] = e.w / e.h; }
            };
            bind(0, getTex(card.image), 0);
            const used = def.tex.map(t => t.k);
            ['mask', 'normal', 'pattern'].forEach(k => {
                bind(TEX_UNIT[k], used.includes(k) ? getTex(fx.tex && fx.tex[k]) : null, TEX_UNIT[k]);
            });

            const p = new Float32Array(6);
            def.params.forEach((pd, i) => { p[i] = (fx.p && fx.p[i] !== undefined) ? fx.p[i] : pd.def; });
            gl.uniform2f(u.uRes, w, h);
            gl.uniform2f(u.uMouse, mx, my);
            gl.uniform1f(u.uTime, performance.now() / 1000);
            gl.uniform1f(u.uFade, fade);
            gl.uniform1f(u.uEffect, def.id);
            gl.uniform1f(u.uBoxAsp, w / h);
            gl.uniform1fv(u.uP, p);
            gl.uniform4fv(u.uHas, has);
            gl.uniform4fv(u.uAsp, asp);
            gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
            ctx.clearRect(0, 0, w, h);
            ctx.drawImage(canvas, 0, 0, w, h);
        }

        // 默认官方卡包（作为初始兜底）

                const status = document.createElement('span');
                status.className = 'fx-tex-status';
                status.textContent = fx.tex[t.k] ? ' ✔ 已选择' : '';
                lb.appendChild(status);
                const inp = document.createElement('input');
                inp.type = 'file'; inp.accept = 'image/*';
                inp.onchange = () => {
                    const file = inp.files[0];
                    if (!file) return;
                    const reader = new FileReader();
                    reader.onload = ev => {
                        fx.tex[t.k] = ev.target.result;
                        slot.fxFiles[t.k] = file;
                        status.textContent = ' ✔ 已选择';
                        pulse(2000);
                    };
                    reader.readAsDataURL(file);
                };
                g.appendChild(lb); g.appendChild(inp);
                panel.appendChild(g);
            });

            def.params.forEach((pd, i) => {
                const row = document.createElement('div');
                row.className = 'fx-row';
                const cur = fx.p[i] !== undefined ? fx.p[i] : pd.def;
                row.innerHTML = `<label><span>${esc(pd.label)}</span><span class="fx-val">${cur}</span></label>`;
                const r = document.createElement('input');
                r.type = 'range'; r.min = pd.min; r.max = pd.max; r.step = pd.step; r.value = cur;
                r.oninput = () => {
                    fx.p[i] = parseFloat(r.value);
                    row.querySelector('.fx-val').textContent = r.value;
                    pulse(1500);
                };
                row.appendChild(r);
                panel.appendChild(row);
            });
        }

        function updateSlotData(index, field, value) {
            currentDraftSlots[index][field] = value;
            if (field === 'name') document.getElementById(`name_preview_${index}`).textContent = value || '未命名';
            if (field === 'desc') document.getElementById(`desc_preview_${index}`).textContent = value || '暂无描述';
        }

        function handleSlotImageSelect(index, inputElement) {
            const file = inputElement.files[0];
            if (file) {
                currentDraftSlots[index].file = file; // 暂存文件对象用于后续上传 Supabase Storage
                const reader = new FileReader();
                reader.onload = ev => {
                    currentDraftSlots[index].image = ev.target.result;
                    document.getElementById(`img_preview_${index}`).src = ev.target.result;
                    if (slotBindings[index]) slotBindings[index].pulse(1500);
                };
                reader.readAsDataURL(file);
            }
        }

        // 返回 { pulse(ms) }：无鼠标悬停时也能自动演示特效
        function bindCard3D(container, card) {
            const el = container.querySelector('.card');
            const cv = container.querySelector('.card-shine');
            const st = { hover: false, tx: 0.5, ty: 0.5, mx: 0.5, my: 0.5, rx: 0, ry: 0, fade: 0, raf: 0, hold: 0 };

            const frame = () => {
                const now = performance.now();
                const held = now < st.hold;
                const on = st.hover || held;
                let tx = st.tx, ty = st.ty;
                if (!st.hover && held) { const t = now / 500; tx = 0.5 + 0.32 * Math.cos(t); ty = 0.5 + 0.32 * Math.sin(t * 1.3); }
                st.mx += (tx - st.mx) * 0.25;
                st.my += (ty - st.my) * 0.25;
                st.fade += ((on ? 1 : 0) - st.fade) * 0.15;
                const rxT = st.hover ? (0.5 - st.my) * 30 : 0, ryT = st.hover ? (st.mx - 0.5) * 30 : 0;
                st.rx += (rxT - st.rx) * 0.2;
                st.ry += (ryT - st.ry) * 0.2;

                const idle = !on && st.fade < 0.01 && Math.abs(st.rx) < 0.05 && Math.abs(st.ry) < 0.05;
                if (idle) {
                    el.style.transform = '';
                    renderFx(cv, card, st.mx, st.my, 0);
                    st.raf = 0;
                    return;
                }
                // 不使用 scale：缩放会使文字层被重采样而变糊
                el.style.transform = `rotateX(${st.rx.toFixed(2)}deg) rotateY(${st.ry.toFixed(2)}deg) translateZ(20px)`;
                renderFx(cv, card, st.mx, st.my, st.fade);
                st.raf = requestAnimationFrame(frame);
            };
            const start = () => { if (!st.raf) st.raf = requestAnimationFrame(frame); };

            container.addEventListener('mouseenter', () => { st.hover = true; start(); });
            container.addEventListener('mousemove', (e) => {
                const rect = container.getBoundingClientRect();
                st.tx = Math.min(1, Math.max(0, (e.clientX - rect.left) / rect.width));
                st.ty = Math.min(1, Math.max(0, (e.clientY - rect.top) / rect.height));
                st.hover = true; start();
            });
            container.addEventListener('mouseleave', () => { st.hover = false; start(); });

            return { pulse(ms) { st.hold = performance.now() + ms; start(); } };
        }

        // --- 核心：将图片上传至 Supabase Storage 并发布卡包到云端数据库 ---
        async function uploadToBucket(file, label) {
            const fileExt = file.name.split('.').pop();
            const fileName = `${Date.now()}_${Math.random().toString(36).substring(2, 9)}.${fileExt}`;
            const { error: uploadError } = await dbClient.storage.from('card-images').upload(fileName, file);
            if (uploadError) throw new Error(`${label} 上传失败: ` + uploadError.message);
            const { data: { publicUrl } } = dbClient.storage.from('card-images').getPublicUrl(fileName);
            return publicUrl;
        }
        async function publishSetToCloud() {
            const cost = 30;
            const currentCoins = getCoins();
            const tip = document.getElementById('workshopTip');
            const packTitle = document.getElementById('packTitleInput').value.trim() || '未命名卡包';

            if (currentCoins < cost) {
                tip.style.color = '#e74c3c';
                tip.textContent = `金币不足！发布套组需要 ${cost} 金币，你当前只有 ${currentCoins} 金币。`;
                return;
            }

            tip.style.color = '#ffd700';
            tip.textContent = '正在上传图片并同步到云端数据库，请稍候...';

            try {
                // 1. 遍历槽位，将玩家上传的图片文件依次存入 Supabase Storage 存储桶
                let processedCards = [];
                for (let i = 0; i < currentDraftSlots.length; i++) {
                    let slot = currentDraftSlots[i];
                    let imageUrl = slot.image;

                    if (slot.file) {
                        imageUrl = await uploadToBucket(slot.file, `图片 ${i + 1}`);
                    }

                    const fx = { type: slot.fx.type, p: slot.fx.p, tex: {} };
                    for (const k of Object.keys(slot.fx.tex || {})) {
                        const f = slot.fxFiles && slot.fxFiles[k];
                        if (f) fx.tex[k] = await uploadToBucket(f, `槽位 ${i + 1} 的 ${k} 贴图`);
                    }

                    processedCards.push({
                        id: Date.now() + i,
                        name: slot.name,
                        rarity: slot.rarity,
                        image: imageUrl,
                        desc: slot.desc,
                        fx
                    });
                }

                // 2. 将整个卡包数据写入 Supabase `card_packs` 数据库表
                const { error: dbError } = await dbClient
                    .from('card_packs')
                    .insert([
                        { 
                            title: packTitle, 
                            description: `包含 ${processedCards.length} 张定制卡片的玩家套组`,
                            cards: processedCards 
                        }
                    ]);

                if (dbError) throw new Error('云端数据库写入失败: ' + dbError.message);

                // 3. 扣除金币并提示成功
                setCoins(currentCoins - cost);
                tip.style.color = '#4cd137';
                tip.textContent = '🎉 发布成功！整套卡包已成功同步至云端，所有玩家都可以在抽卡中心抽取它了！';
                setTimeout(() => { tip.textContent = ''; }, 4000);

            } catch (err) {
                console.error(err);
                tip.style.color = '#e74c3c';
                tip.textContent = '发布失败: ' + err.message;
            }
        }

        renderWorkshopSlots();

        // --- 2. 抽卡中心逻辑（从 Supabase 加载卡包并定向抽取） ---
        async function fetchCloudPacksAndRender() {
            const container = document.getElementById('packSelectionContainer');
            container.innerHTML = '<p style="font-size: 12px; color: #a0a0ab;">正在从云端同步卡包...</p>';

            try {
                const { data, error } = await dbClient.from('card_packs').select('*');
                if (error) throw error;

                cloudPacks = [defaultPack];
                if (data && data.length > 0) {
                    data.forEach(row => {
                        cloudPacks.push({
                            id: row.id,
                            title: row.title,
                            description: row.description,
                            cards: row.cards
                        });
                    });
                }
            } catch (err) {
                console.warn('从云端加载卡包失败，使用默认卡包', err);
            }

            renderPackList();
        }

        function renderPackList() {
            const container = document.getElementById('packSelectionContainer');
            container.innerHTML = '';

            cloudPacks.forEach(pack => {
                const item = document.createElement('div');
                item.className = `pack-item ${selectedPack.id === pack.id ? 'selected' : ''}`;
                item.innerHTML = `
                    <div style="font-weight: bold; font-size: 13px; color: #ffd700;">${esc(pack.title)}</div>
                    <div style="font-size: 11px; color: #a0a0ab; margin-top: 2px;">包含卡片: ${pack.cards.length}张</div>
                `;
                item.onclick = () => selectPack(pack);
                container.appendChild(item);
            });

            // 默认选中第一个
            if (!cloudPacks.some(p => p.id === selectedPack.id)) {
                selectedPack = cloudPacks[0];
            }
            updateSelectedPackUI();
        }

        function selectPack(pack) {
            selectedPack = pack;
            renderPackList();
        }

        function updateSelectedPackUI() {
            document.getElementById('selectedPackTitle').textContent = selectedPack.title;
            document.getElementById('selectedPackDesc').textContent = selectedPack.description || '定向抽取该卡包内的专属卡片';
            renderPackContents();
        }

        const RARITY_RATE = { SSR: 5, SR: 25, N: 70 };

        // 稀有度权重在卡包实际存在的稀有度中归一化，再在同稀有度卡片间平分
        function computeRates(pack) {
            const by = {};
            pack.cards.forEach(c => { (by[c.rarity] = by[c.rarity] || []).push(c); });
            const present = ['SSR', 'SR', 'N'].filter(r => by[r]);
            const total = present.reduce((s, r) => s + RARITY_RATE[r], 0);
            return { by, present, total };
        }

        function renderPackContents() {
            const box = document.getElementById('packContents');
            const { by, present, total } = computeRates(selectedPack);
            if (!present.length) { box.innerHTML = '<h4>卡包内容</h4><p style="font-size:12px;color:#666;">该卡包没有卡片</p>'; return; }
            const summary = present.map(r => `<span class="r-${r}">${r}：${(RARITY_RATE[r] / total * 100).toFixed(1)}%（${by[r].length}张）</span>`).join('');
            const items = present.flatMap(r => by[r].map(c => `
                <div class="pc-item">
                    <img src="${esc(c.image)}" alt="">
                    <div class="pc-info"><b>${esc(c.name)}</b><span class="r-${r}">${r}</span> · <span>${(RARITY_RATE[r] / total / by[r].length * 100).toFixed(2)}%</span></div>
                </div>`)).join('');
            box.innerHTML = `<h4>卡包内容与出率</h4><div class="rate-summary">${summary}</div><div class="pc-list">${items}</div>`;
        }

        let pendingDrawCount = 1;

        function startGacha(count) {
            const cost = count === 1 ? 10 : 45;
            const currentCoins = getCoins();

            if (currentCoins < cost) {
                alert(`金币不足！抽卡需要 ${cost} 金币，你当前有 ${currentCoins} 金币。`);
                return;
            }

            setCoins(currentCoins - cost);
            pendingDrawCount = count;
            document.getElementById('gachaOverlay').style.display = 'flex';
            document.getElementById('summonTip').textContent = count === 1 ? "消耗 10 金币，感应单抽能量..." : "消耗 45 金币，感应五连星光...";
        }

        function finishSummonAnimation() {
            document.getElementById('gachaOverlay').style.display = 'none';

            const resultBox = document.getElementById('gachaResult');
            resultBox.innerHTML = '';
            
            let inv = getInventory();
            let drawnCards = [];
            const { by, present, total } = computeRates(selectedPack);
            if (!present.length) return;

            for (let i = 0; i < pendingDrawCount; i++) {
                let rand = Math.random() * total;
                let targetRarity = present[present.length - 1];
                for (const r of present) {
                    if (rand < RARITY_RATE[r]) { targetRarity = r; break; }
                    rand -= RARITY_RATE[r];
                }

                const filtered = by[targetRarity];
                const drawn = filtered[Math.floor(Math.random() * filtered.length)];
                drawnCards.push(drawn);

                // 只有抽到的卡片才正式存入集卡册
                if (inv[drawn.id]) { inv[drawn.id].count++; } 
                else { inv[drawn.id] = { card: drawn, count: 1 }; }
            }

            localStorage.setItem('myInventory', JSON.stringify(inv));

            drawnCards.forEach((drawn, index) => {
                const cardHtml = document.createElement('div');
                cardHtml.className = 'card-container gacha-card-item reveal-anim';
                cardHtml.style.animationDelay = `${index * 0.15}s`;
                cardHtml.innerHTML = `
                    <div class="card ${drawn.rarity.toLowerCase()}">
                        <div class="card-content">
                            <div class="card-header"><span>${esc(drawn.rarity)}</span><span>#${esc(drawn.id.toString().slice(-4))}</span></div>
                            <div class="card-image-box"><img src="${esc(drawn.image)}" alt=""><canvas class="card-shine"></canvas></div>
                            <div class="card-footer"><h3>${esc(drawn.name)}</h3><p>${esc(drawn.desc)}</p></div>
                        </div>
                    </div>
                `;
                resultBox.appendChild(cardHtml);
                bindCard3D(cardHtml, drawn);
            });
        }

        // --- 3. 集卡册与分解逻辑 ---
        function renderCollection() {
            const grid = document.getElementById('collectionGrid');
            const inv = getInventory();
            grid.innerHTML = '';

            const keys = Object.keys(inv);
            if (keys.length === 0) {
                grid.innerHTML = '<p style="color: #666; grid-column: 1/-1; text-align: center;">集卡册空空如也，快去抽卡获取卡片吧！</p>';
                return;
            }

            keys.forEach(key => {
                const item = inv[key];
                if (item.count <= 0) return;

                const c = item.card;
                const wrapper = document.createElement('div');
                wrapper.className = 'collection-card-wrapper';

                let recycleValue = 2;
                if (c.rarity === 'SR') recycleValue = 5;
                if (c.rarity === 'SSR') recycleValue = 20;

                wrapper.innerHTML = `
                    <div class="card-container col-card" style="width: 200px; height: 290px;">
                        <div class="card ${c.rarity.toLowerCase()}" style="width: 200px; height: 290px;">
                            <div class="card-content" style="padding: 10px;">
                                <div class="card-header" style="font-size: 12px;"><span>${esc(c.rarity)}</span><span>#${esc(c.id.toString().slice(-4))}</span></div>
                                <div class="card-image-box" style="height: 130px;"><img src="${esc(c.image)}" alt=""><canvas class="card-shine"></canvas></div>
                                <div class="card-footer"><h3 style="font-size: 13px;">${esc(c.name)}</h3><p style="font-size: 10px;">${esc(c.desc)}</p></div>
                            </div>
                        </div>
                    </div>
                    <div class="card-meta">
                        <span class="card-count">x${item.count}</span>
                        <button class="recycle-btn" onclick="recycleCard(${c.id}, ${recycleValue})">分解 (+${recycleValue}💰)</button>
                    </div>
                `;
                grid.appendChild(wrapper);
                bindCard3D(wrapper.querySelector('.col-card'), c);
            });
        }

        updateSelectedPackUI();

        function recycleCard(cardId, refundCoins) {
            let inv = getInventory();
            if (inv[cardId] && inv[cardId].count > 0) {
                inv[cardId].count--;
                if (inv[cardId].count === 0) delete inv[cardId];
                localStorage.setItem('myInventory', JSON.stringify(inv));
                setCoins(getCoins() + refundCoins);
                renderCollection();
            }
        }
    </script>
